- id: llm-deepseek
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: sandbox
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: restaurant-project
      name: '../../../restaurant-design/src/service.ts'
      config:
        sourceHtml: !!js "process.cwd() + '/restaurant.html'"
        projectPath: !!js "process.cwd() + '/layout.json'"

    - id: restaurant-tools
      name: '../../../restaurant-design/src/plugin.ts'

    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
